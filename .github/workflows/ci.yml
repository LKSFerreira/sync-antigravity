name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Testar e empacotar VSIX
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Compilar e testar
        run: npm test

      - name: Gerar bundle de produção
        run: npm run package

      - name: Criar diretório de artefatos
        run: mkdir -p artifacts

      - name: Gerar VSIX
        run: npx --no-install vsce package --out artifacts/sync-antigravity.vsix

      - name: Validar conteúdo do VSIX
        run: |
          unzip -Z1 artifacts/sync-antigravity.vsix | tee artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.wasm' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.js' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/layout-replacement-helper.js' artifacts/vsix-files.txt
          ! grep -E '(^|/)(\.env|client_secret_|preview-login-success\.html|icon_original\.png)' artifacts/vsix-files.txt
          ! grep -E '(^|/)(\.agents|\.metadocs)(/|$)' artifacts/vsix-files.txt

      - name: Gerar hash SHA-256
        run: sha256sum artifacts/sync-antigravity.vsix > artifacts/SHA256SUMS

      - name: Guardar artefatos verificados
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-antigravity-vsix
          path: artifacts/
          if-no-files-found: error
