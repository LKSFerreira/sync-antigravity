name: Release verificável

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publicar-release:
    name: Empacotar e publicar release da tag
    runs-on: ubuntu-24.04
    steps:
      - name: Obter tag de release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Compilar e testar
        run: npm test

      - name: Validar catálogos de localização
        run: npm run l10n:check

      - name: Gerar bundle de produção
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run package

      - name: Criar diretório de artefatos
        run: mkdir -p artifacts

      - name: Gerar VSIX
        run: npx --no-install vsce package --out artifacts/sync-antigravity.vsix

      - name: Validar conteúdo do VSIX
        run: |
          unzip -Z1 artifacts/sync-antigravity.vsix | tee artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.wasm' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.js' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/layout-replacement-helper.js' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/webview/localizacao.js' artifacts/vsix-files.txt
          grep -Fx 'extension/package.nls.json' artifacts/vsix-files.txt
          grep -Fx 'extension/package.nls.pt.json' artifacts/vsix-files.txt
          grep -Fx 'extension/package.nls.pt-br.json' artifacts/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.json' artifacts/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.pt.json' artifacts/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.pt-br.json' artifacts/vsix-files.txt
          ! grep -E '(^|/)(\.env|client_secret_|preview-login-success\.html|icon_original\.png)' artifacts/vsix-files.txt
          ! grep -E '(^|/)(\.agents|\.metadocs)(/|$)' artifacts/vsix-files.txt

      - name: Gerar hash SHA-256
        run: sha256sum artifacts/sync-antigravity.vsix > artifacts/SHA256SUMS

      - name: Validar versão da tag
        run: |
          VERSAO_PACOTE="$(node -p "require('./package.json').version")"

          if [[ "v${VERSAO_PACOTE}" != "${GITHUB_REF_NAME}" ]]; then
            echo "A tag ${GITHUB_REF_NAME} não corresponde à versão ${VERSAO_PACOTE} de package.json."
            exit 1
          fi

      - name: Publicar no Open VSX por OIDC
        run: npx --no-install ovsx publish artifacts/sync-antigravity.vsix --trusted-publishing

      - name: Publicar release da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            artifacts/sync-antigravity.vsix \
            artifacts/SHA256SUMS
