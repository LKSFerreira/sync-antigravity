name: Release verificável

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publicar-release:
    name: Empacotar e publicar release da tag
    runs-on: ubuntu-24.04
    steps:
      - name: Obter tag de release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Compilar e testar
        run: npm test

      - name: Gerar bundle de produção
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run package

      - name: Gerar VSIX
        run: npx --no-install vsce package --out artifacts/sync-antigravity.vsix

      - name: Validar conteúdo do VSIX
        run: |
          unzip -Z1 artifacts/sync-antigravity.vsix | tee artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.wasm' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/sql-wasm.js' artifacts/vsix-files.txt
          grep -Fx 'extension/dist/layout-replacement-helper.js' artifacts/vsix-files.txt
          ! grep -E '(^|/)(\.env|client_secret_|preview-login-success\.html|icon_original\.png)' artifacts/vsix-files.txt

      - name: Gerar hash SHA-256
        run: sha256sum artifacts/sync-antigravity.vsix > artifacts/SHA256SUMS

      - name: Definir modo de publicação no Open VSX
        env:
          OVSX_BOOTSTRAP_TOKEN: ${{ secrets.OVSX_BOOTSTRAP_TOKEN }}
        run: |
          VERSAO_PACOTE="$(node -p \"require('./package.json').version\")"

          if [[ "v${VERSAO_PACOTE}" != "${GITHUB_REF_NAME}" ]]; then
            echo "A tag ${GITHUB_REF_NAME} não corresponde à versão ${VERSAO_PACOTE} de package.json."
            exit 1
          fi

          if [[ -n "${OVSX_BOOTSTRAP_TOKEN}" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v0.7.17" ]]; then
              echo "OVSX_BOOTSTRAP_TOKEN só pode publicar a tag inicial v0.7.17. Remova o secret antes de publicar outra versão."
              exit 1
            fi

            echo "MODO_PUBLICACAO_OPEN_VSX=bootstrap" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "MODO_PUBLICACAO_OPEN_VSX=oidc" >> "$GITHUB_ENV"

      - name: Publicar primeira versão no Open VSX
        if: env.MODO_PUBLICACAO_OPEN_VSX == 'bootstrap'
        env:
          OVSX_PAT: ${{ secrets.OVSX_BOOTSTRAP_TOKEN }}
        run: npx --no-install ovsx publish artifacts/sync-antigravity.vsix

      - name: Publicar versões seguintes no Open VSX por OIDC
        if: env.MODO_PUBLICACAO_OPEN_VSX == 'oidc'
        run: npx --no-install ovsx publish artifacts/sync-antigravity.vsix --trusted-publishing

      - name: Publicar release da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            artifacts/sync-antigravity.vsix \
            artifacts/SHA256SUMS
